<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orbit Mobile · Prescott Listing System</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orbit">
<meta name="theme-color" content="#2D2E41">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#2D2E41;--ink:#1E1E1E;--mute:#6B6A66;--line:#D3D0CB;--soft:#E6E3DE;--ground:#F7F6F3;--card:#fff;--lav:#F2F1FA;--lavline:#D6D4EA;--ok:#2E7D4F;--warn:#8A6500;--err:#B03A2E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans",-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:#E9E7E2;font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}

/* ---------- desktop review layout ---------- */
.stage{display:flex;gap:36px;justify-content:center;align-items:flex-start;padding:28px 24px 60px;min-height:100%}
.guide{width:340px;flex:0 0 340px;font-size:13px;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
.guide h1{font-size:18px;margin:0 0 4px}
.guide .sub{color:var(--mute);margin-bottom:14px}
.guide h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 6px;font-weight:600}
.guide ol,.guide ul{margin:0;padding:0;list-style:none}
.guide li{margin:0 0 4px}
.guide li button{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:6px}
.guide li button:hover{border-color:var(--navy)}
.guide li button b{display:block;font-weight:600;font-size:13px}
.guide li button span{color:var(--mute);font-size:12px}
.guide .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.guide .row a,.guide .row button{font-size:12px;padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:6px;text-decoration:none;color:var(--ink)}
.guide .note{background:#fff;border:1px solid var(--line);border-left:3px solid var(--navy);padding:8px 10px;margin-top:10px;color:var(--ink)}

.phone{width:390px;height:844px;flex:0 0 390px;background:#111;border-radius:54px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.18);position:relative}
.screen{width:100%;height:100%;background:var(--ground);border-radius:43px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.sbar{height:47px;flex:0 0 47px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:600;background:inherit}
.sbar .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;background:#111;border-radius:20px}
.sbar .sig{font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;opacity:.85;z-index:30}

/* ---------- real phone: full screen ---------- */
@media (max-width:600px){
  body{background:var(--ground)}
  .stage{padding:0;display:block}
  .guide{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--ground)}
  .screen{border-radius:0}
  .sbar,.homebar{display:none}
  .app{padding-top:env(safe-area-inset-top)}
  .demofab{display:flex!important}
}

/* ---------- app chrome ---------- */
.app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.hdr{display:flex;align-items:center;gap:8px;padding:6px 12px 8px;min-height:48px;background:var(--ground)}
.hdr .back{all:unset;cursor:pointer;font-size:16px;color:var(--navy);display:flex;align-items:center;gap:2px;padding:6px 4px;min-width:44px}
.hdr .back::before{content:"‹";font-size:28px;line-height:16px;margin-right:2px}
.hdr .t{flex:1;font-weight:600;text-align:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sp{min-width:44px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 28px}
.foot{padding:10px 16px 26px;background:var(--ground);border-top:1px solid var(--line);display:flex;gap:10px}
.foot .btn{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;font-size:15px}
.btn.primary{background:var(--navy);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink);font-weight:500}
.btn.sm{min-height:36px;font-size:13px;padding:0 12px;border-radius:10px}
.btn[disabled]{opacity:.4}
.btn.full{width:100%}
.orb{color:#7C79B8}
.btn.primary .orb{color:#C9C6F0}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;margin:18px 2px 8px;display:flex;align-items:center}
.sec a,.sec button.link{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
.mute{color:var(--mute)}
.sm{font-size:13px}
.xs{font-size:12px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;white-space:nowrap;color:var(--mute)}
.pill.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill.warn{border-color:#D9B800;color:var(--warn);background:#FFF8D6}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.lav{background:var(--lav);border-color:var(--lavline);color:var(--navy)}
.link{all:unset;cursor:pointer;color:var(--navy);text-decoration:underline;text-underline-offset:2px}

/* home */
.hello{display:flex;align-items:center;margin:4px 2px 12px}
.hello h1{font-size:26px;margin:0;flex:1}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 6px 0 12px;height:48px}
.search input{flex:1;border:none;outline:none;font-size:16px;background:transparent;min-width:0}
.mic{width:38px;height:38px;border-radius:50%;border:none;background:var(--lav);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:0 0 38px}
.mic svg{width:18px;height:18px}
.debriefbtn{display:flex;align-items:center;gap:14px;width:100%;margin:14px 0 4px;padding:16px;border-radius:16px;border:none;background:var(--navy);color:#fff;text-align:left}
.debriefbtn .big{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;flex:0 0 52px}
.debriefbtn .big svg{width:24px;height:24px}
.debriefbtn b{display:block;font-size:17px;color:#fff}
.debriefbtn span{font-size:13px;color:#C9C6F0}
.banner{display:flex;gap:10px;align-items:center;border-radius:12px;padding:11px 12px;margin:10px 0 0;font-size:13px;border:1px solid var(--lavline);background:var(--lav)}
.banner.off{background:#FFF8D6;border-color:#E6CF5C}
.banner b{display:block;font-size:14px}
.banner .btn{margin-left:auto;flex:0 0 auto}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--soft);cursor:pointer;min-height:56px}
.li:last-child{border-bottom:none}
.li:active{background:#F0EEEA}
.li .ic{width:34px;height:34px;border-radius:9px;background:#F0EEEA;display:flex;align-items:center;justify-content:center;flex:0 0 34px;font-size:15px;color:var(--navy)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{font-size:13px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{color:#B5B2AC;font-size:20px}

/* record */
.rhead h1{font-size:22px;margin:2px 0 2px}
.rhead .who{font-size:14px;color:var(--mute)}
.rhead .who a{text-decoration:none}
.signal{display:flex;gap:10px;background:var(--lav);border:1px solid var(--lavline);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:13.5px}
.signal b{display:block;font-size:14px}
.twobtn{display:flex;gap:10px;margin:4px 0 6px}
.twobtn .btn{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tl{position:relative}
.te{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:0 0 8px;cursor:pointer}
.te.new{border-color:var(--navy);box-shadow:0 0 0 2px rgba(45,46,65,.08)}
.te .top{display:flex;gap:10px;align-items:flex-start}
.te .ch{width:30px;height:30px;border-radius:8px;background:#F0EEEA;display:flex;align-items:center;justify-content:center;flex:0 0 30px;font-size:14px}
.te .meta{font-size:12px;color:var(--mute)}
.te .sum{font-size:14px;margin-top:2px}
.te .more{display:none;margin-top:10px;border-top:1px solid var(--soft);padding-top:10px;font-size:13.5px}
.te.open .more{display:block}
.stmt{background:#FBFAF7;border:1px solid var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13.5px}
.stmt .by{font-size:12px;color:var(--mute);margin-top:2px}
.tscript{font-size:13px;color:var(--mute);font-style:italic;background:#FBFAF7;border-radius:8px;padding:8px 10px;margin-top:6px}
.ro{font-size:12px;color:var(--mute);text-align:center;margin:16px 0 4px}

/* brief */
.bsec{margin:0 0 14px}
.bsec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 4px;font-weight:600}
.bsec p{margin:0;font-size:14.5px}
.bsec ul{margin:4px 0 0;padding-left:18px;font-size:14.5px}
.watch{background:#FFF8D6;border:1px solid #E6CF5C;border-radius:10px;padding:9px 11px;font-size:13.5px;margin:0 0 14px}
.opener{border-left:3px solid var(--navy);padding:4px 0 4px 10px;font-size:14.5px;margin:0}
.chat{margin-top:6px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14px;margin:0 0 8px}
.msg.u{margin-left:auto;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.a{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a .src{font-size:11.5px;color:var(--mute);margin-top:4px}
.askbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.askbar input{flex:1;border:1px solid var(--line);border-radius:20px;height:40px;padding:0 14px;font-size:16px;outline:none;min-width:0}
.askbar .send{width:40px;height:40px;border-radius:50%;border:none;background:var(--navy);color:#fff;font-size:17px}
.bfoot{display:flex;gap:10px;padding:8px 12px 24px;background:#fff}
.bfoot .btn{flex:1}

/* debrief */
.recwrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 8px 8px}
.recwrap h2{font-size:20px;margin:0 0 4px}
.recbtn{width:132px;height:132px;border-radius:50%;border:none;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;margin:26px 0 14px;position:relative}
.recbtn svg{width:44px;height:44px}
.recbtn.on{background:#B03A2E}
.recbtn.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(176,58,46,.35);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.18);opacity:0}}
.timer{font-size:28px;font-variant-numeric:tabular-nums;font-weight:500}
.wave{display:flex;gap:3px;align-items:center;height:34px;margin:8px 0}
.wave i{display:block;width:4px;border-radius:2px;background:#B03A2E;animation:wv 0.9s ease-in-out infinite}
@keyframes wv{0%,100%{height:6px}50%{height:30px}}
.keepopen{font-size:13px;color:var(--mute);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:14px}
.ta{width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;line-height:1.5;background:#fff;resize:vertical}
.spinner{width:28px;height:28px;border:3px solid var(--lavline);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.orbmsg{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
.orbmsg .o{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 30px;font-size:14px}
.orbmsg .b{background:#fff;border:1px solid var(--line);border-radius:14px;border-top-left-radius:4px;padding:10px 12px;font-size:14.5px;flex:1}
.opts{display:flex;flex-direction:column;gap:8px;margin:6px 0 0 40px}
.opts button{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;text-align:left;padding:0 14px;font-size:15px}
.opts button.on{border-color:var(--navy);background:var(--lav);font-weight:600}
.opts button .s{display:block;font-size:12px;color:var(--mute);font-weight:400}

/* bundled card */
.bundle{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.bundle .bh{padding:12px 14px;border-bottom:1px solid var(--soft);display:flex;align-items:center;gap:8px}
.bundle .bh b{flex:1}
.bgrp{padding:8px 14px 2px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;background:#FBFAF7;border-bottom:1px solid var(--soft)}
.bi{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--soft);align-items:flex-start}
.bi:last-child{border-bottom:none}
.bi.offitem .bt{opacity:.5}
.cb{width:24px;height:24px;border-radius:7px;border:1.5px solid #9A9892;flex:0 0 24px;display:flex;align-items:center;justify-content:center;background:#fff;margin-top:1px;color:#fff;font-size:14px}
.cb.on{background:var(--navy);border-color:var(--navy)}
.bt{flex:1;min-width:0}
.bt b{display:block;font-size:14.5px;font-weight:600}
.bt .d{font-size:13.5px}
.bt .m{font-size:12px;color:var(--mute);margin-top:2px}
.bt .tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.bt .edit{font-size:13px;margin-top:6px}
.bt textarea,.bt select{width:100%;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px;background:#fff}
.bt textarea{min-height:84px}

.receipt{text-align:center;padding:30px 6px 10px}
.receipt .ok{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.receipt h2{margin:0 0 6px;font-size:21px}
.undo{display:flex;align-items:center;gap:10px;background:#1E1E1E;color:#fff;border-radius:12px;padding:10px 12px;margin:16px 0 6px;font-size:14px;text-align:left}
.undo button{margin-left:auto;background:none;border:none;color:#C9C6F0;font-weight:600;font-size:15px}
.undo .bar{height:3px;background:#C9C6F0;border-radius:2px;margin-top:6px;transition:width 1s linear}

/* first run */
.fr{padding:24px 22px;text-align:center;display:flex;flex-direction:column;align-items:center}
.fr .appicon{width:84px;height:84px;border-radius:20px;margin:14px 0 18px;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.fr h1{font-size:23px;margin:0 0 8px}
.fr p{margin:0 0 16px;color:var(--mute);font-size:15px}
.steps{text-align:left;width:100%;margin:6px 0 18px}
.steps div{display:flex;gap:12px;align-items:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:15px}
.steps i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.alert{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:40}
.alert .bx{width:270px;background:rgba(242,242,242,.97);border-radius:14px;text-align:center;overflow:hidden}
.alert .bx .q{padding:18px 16px 14px;font-size:15px}
.alert .bx .q b{display:block;font-size:16px;margin-bottom:4px}
.alert .bx .q span{font-size:13px}
.alert .bx .bs{display:flex;border-top:1px solid #C8C8C8}
.alert .bx .bs button{flex:1;border:none;background:none;height:44px;color:#0A7AFF;font-size:16px}
.alert .bx .bs button+button{border-left:1px solid #C8C8C8;font-weight:600}

.sheet{position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:50;display:flex;align-items:flex-end}
.sheet .in{background:var(--ground);width:100%;max-height:80%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px 30px}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#C8C5BF;margin:0 auto 12px}
.toast{position:absolute;left:16px;right:16px;bottom:40px;background:#1E1E1E;color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;z-index:45;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.demofab{display:none;position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;background:#1E1E1E;color:#fff;border:none;border-radius:999px;padding:8px 12px;font-size:12px;opacity:.85}
.hide{display:none!important}
</style>
</head>
<body>
<div class="stage">
  <aside class="guide" id="guide"></aside>
  <div class="phone">
    <div class="screen" id="screen">
      <div class="sbar"><span>2:14</span><span class="island"></span><span class="sig" id="sig">●●●● 5G ▮</span></div>
      <div class="app" id="app"></div>
      <div class="toast" id="toast"></div>
      <div class="homebar"></div>
    </div>
  </div>
</div>
<button class="demofab" onclick="openDemoSheet()">Demo screens</button>

<script>
/* =====================================================================
   Orbit Mobile · clickable mockup for Orbit AI PRD v0.5 §15

   ===================================================================== */
var ICON = {

};
var CH = { Call:'☏', Meeting:'◉', Email:'✉', Mail:'✉︎', 'Drop-by':'⌂', Voicemail:'☏', QR:'▦', Text:'✎' };

/* ---------------- data ---------------- */
var OWNERS = {

    signal:['Loan on 3120 Grand Ave matures in 58 days','Jan 10, 2027 · no new loan recorded · derived from the 2017 deed of trust'],

    touches:[

  [].forEach.call(sh.querySelectorAll('.wave i'),function(i,n){i.style.animationDelay=(n*0.08)+'s'});

/* ---------------- M-3 Brief ---------------- */
function brief(k){
  var o=OWNERS[k]; if(!o) return home(); var b=BRIEF[k]||genericBrief(k); S.chat[k]=S.chat[k]||[];
  var addedStmts=[]; (S.added[k]||[]).forEach(function(t){(t.stmts||[]).forEach(function(s){addedStmts.push(s)})});
  var told=addedStmts.concat(b.told);
  var asked=S.chat[k].map(function(m){return m[0]}); var chips=b.chips.filter(function(c){return asked.indexOf(c[0])<0});
  $app.innerHTML=hdr('Attack Brief',{right:'<span class="orb">✦</span>'})+'<div class="scroll" id="bscroll">'+
    '<div class="rhead" style="margin-bottom:10px"><h1 style="font-size:20px">'+esc(o.name)+'</h1><div class="who">'+esc(o.contact)+' · <a href="tel:'+o.phone.replace(/\D/g,'')+'">'+o.phone+'</a></div></div>'+
    '<div class="watch">⚑ '+esc(b.watch)+'</div>'+
    bs('Who they are','<p>'+esc(b.who)+'</p>')+
    bs('What they own','<ul>'+b.own.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>')+
    bs('What we’ve sent and said','<p>'+esc(b.sent)+'</p>')+
    bs('Why now','<p>'+esc(b.why)+'</p>')+
    bs('What they’ve told us',told.length?told.map(function(s){return '<div class="stmt">“'+esc(s.t)+'” '+(s.verified?'<span class="pill ok">verified</span>':'<span class="pill warn">unverified</span>')+(s.old?' <span class="pill warn">may be out of date</span>':'')+'<div class="by">'+esc(s.by)+'</div></div>'}).join(''):'<p class="mute">Nothing on file yet. Debriefs add to this.</p>')+
    bs('Talking points','<ul>'+b.points.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>')+
    bs('Who on the team has the relationship','<p>'+esc(b.team)+'</p>')+
    '<div class="xs mute">'+esc(b.src)+'. Orbit never predicts who will sell or gives a value.</div>'+
    '<div class="sec">Ask the brief</div><div class="chat" id="chat">'+S.chat[k].map(function(m){return '<div class="msg u">'+esc(m[0])+'</div><div class="msg a">'+esc(m[1])+'<div class="src">Source: '+esc(m[2])+'</div></div>'}).join('')+'</div>'+
    '<div class="chips" style="flex-wrap:wrap">'+chips.map(function(c,i){return '<button class="chip" onclick="askChip(\''+k+'\','+b.chips.indexOf(c)+')">'+esc(c[0])+'</button>'}).join('')+'</div>'+
  '</div>'+
  '<div class="askbar"><input id="askq" placeholder="Ask about '+esc(o.first)+'…" onkeydown="if(event.key===\'Enter\')askTyped(\''+k+'\')"><button class="mic" onclick="askVoice(\''+k+'\')">'+ICON.mic+'</button><button class="send" onclick="askTyped(\''+k+'\')">↑</button></div>'+
  '<div class="bfoot"><button class="btn ghost" onclick="back()">Done</button><button class="btn primary" onclick="startDebrief(\''+k+'\')">Log this touch →</button></div>';
}
function bs(h,body){return '<div class="bsec"><h3>'+h+'</h3>'+body+'</div>'}
function askChip(k,i){var b=BRIEF[k]||genericBrief(k);var c=b.chips[i];S.chat[k].push([c[0],c[1],c[2]]);brief(k);scrollEnd()}
function askVoice(k){var b=BRIEF[k]||genericBrief(k);var v=b.voiceQ||['Who else on the team has talked to them?',b.chips[0][1],'Touch Timeline'];
  listenSheet('Ask by voice',[v[0]],function(){S.chat[k].push(v);brief(k);scrollEnd()})}
function askTyped(k){var el=document.getElementById('askq');var q=el.value.trim();if(!q)return;var ql=q.toLowerCase();var b=BRIEF[k]||genericBrief(k);var a;
  if(/value|worth|price.*(his|her|their)|how much/.test(ql)) a=['I can’t give a value for their buildings. A BOV is the way to answer that, and recent nearby sales are in the brief.','Guardrail: no valuations'];
  else if(/loan|refi|matur/.test(ql)&&b.voiceQ) a=[b.voiceQ[1],b.voiceQ[2]];
  else if(/sell|motivat|likely/.test(ql)) a=['I don’t predict who will sell. Here’s what’s recorded: '+b.why,'Guardrail: no predictions'];
  else { var hit=b.chips.filter(function(c){return c[0].toLowerCase().split(/\W+/).some(function(w){return w.length>4&&ql.indexOf(w)>-1})})[0];
    a=hit?[hit[1],hit[2]]:['In the demo I can answer the suggested questions. In the product, every answer comes from the record and cites its source.','Demo']; }
  S.chat[k].push([q,a[0],a[1]]);brief(k);scrollEnd()}
function scrollEnd(){var s=document.getElementById('bscroll');if(s)s.scrollTop=s.scrollHeight}

/* ---------------- M-4 Debrief ---------------- */
/* S.db = {owner, prop, from:'home'|'record', step, variant:'normal'|'two'|'cut'|'offline', text, answers, items, sec} */
function startDebrief(ownerKey,propKey,variant){
  S.db={owner:ownerKey||null,from:ownerKey?'record':'home',prop:propKey||null,step:'ready',variant:variant||'normal',text:'',answers:[],items:null,sec:0,isTran:false};
  go('debrief');
}
function leaveDebrief(){
  var d=S.db; if(!d) return;
  if(['transcript','owner','qs','card'].indexOf(d.step)>-1){ S.draft={db:d,label:(d.owner?OWNERS[d.owner].name.replace(/ (LLC|LP|Trust)$/,'')+', ':'')+'recorded 2:14 PM'}; }
  clearInterval(d.tick); S.db=null;
}
function signalBack(){S.offline=false;home();toast('Back online. Uploading…');setTimeout(function(){var q=S.queued;S.queued=null;S.draft={db:{owner:null,from:'home',step:'transcript',variant:'normal',text:SCRIPT.full,answers:[],items:null,sec:112},label:'Recorded '+q.at+' · '+q.len+' · ready to review'};if((location.hash||'#home')==='#home')home()},1600)}
function resumeDraft(){var d=S.draft.db;S.draft=null;S.db=d;go('debrief')}
function debrief(){
  var d=S.db; if(!d){ startDebrief(null); return; }
  var who=d.owner?OWNERS[d.owner].first:null;
  var title='Debrief'+(d.owner&&d.from==='record'?' · '+OWNERS[d.owner].name.split(' ')[0]:'');
  var H=hdr(title,{backLabel:'Close'});
  if(d.step==='ready'||d.step==='rec'){
    var on=d.step==='rec';
    $app.innerHTML=H+'<div class="scroll"><div class="recwrap">'+
      '<h2>'+(on?'Listening…':'What happened?')+'</h2><div class="mute sm">'+(on?'Talk the way you would to Edson. Tap stop when you’re done.':(who?'Tell Orbit about your conversation with '+esc(who)+'.':'Say who you talked to and what happened.'))+'</div>'+
      '<button class="recbtn'+(on?' on':'')+'" onclick="'+(on?'stopRec()':'startRec()')+'">'+(on?ICON.stop:ICON.mic)+'</button>'+
      '<div class="timer" id="tmr">'+fmt(d.sec)+'</div>'+(on?'<div class="wave">'+'<i></i>'.repeat(14)+'</div>':'')+
      (on?'<div class="keepopen">Keep Orbit open while you talk. On iPhone, recording stops if the screen locks.</div>':'<button class="link" style="margin-top:16px" onclick="typeInstead()">Type instead</button>')+
      (!on&&!d.owner?'<div class="keepopen" style="margin-top:22px">Tip: start with the owner’s name. Orbit will confirm who you mean before anything is saved.</div>':'')+
      (!on&&S.offline?'<div class="banner off" style="text-align:left"><div><b>No signal</b>You can still record. Orbit saves it on this phone and uploads it later.</div></div>':'')+
    '</div></div>';
    [].forEach.call($app.querySelectorAll('.wave i'),function(i,n){i.style.animationDelay=(n*0.07)+'s'});
    return;
  }
  if(d.step==='cut'){
    $app.innerHTML=H+'<div class="scroll"><div class="banner off" style="margin-top:4px"><div><b>Recording stopped: the screen locked</b>Orbit kept what you said up to 0:42.</div></div>'+
      '<div class="sec">What Orbit heard</div><div class="tscript" style="font-size:15px;font-style:normal;color:var(--ink)">'+esc(SCRIPT.part)+'</div></div>'+
      '<div class="foot"><button class="btn ghost" onclick="S.db.text=SCRIPT.part;S.db.step=\'transcript\';debrief()">Use what I have</button><button class="btn primary" onclick="S.db.cutResume=true;startRec()">Record the rest</button></div>';
    return;
  }
  if(d.step==='offline-saved'){
    $app.innerHTML=H+'<div class="scroll"><div class="receipt"><div class="ok" style="background:var(--warn)">⇪</div><h2>Saved on this phone</h2><div class="mute">No signal right now. Orbit will upload and transcribe your '+fmt(d.sec)+' recording when you’re back online. Open Orbit then to finish it.</div></div></div><div class="foot"><button class="btn primary" onclick="S.db=null;go(\'home\')">Back to Home</button></div>';
    return;
  }
  if(d.step==='transcribing'||d.step==='thinking'){
    $app.innerHTML=H+'<div class="scroll"><div class="spinner"></div><div style="text-align:center" class="mute">'+(d.step==='transcribing'?'Turning your recording into text…':'Orbit is reading your debrief…')+'</div></div>';
    return;
  }
  if(d.step==='transcript'){
    $app.innerHTML=H+'<div class="scroll"><div class="sec" style="margin-top:4px">Your debrief <span class="xs" style="margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400">Fix anything Orbit misheard</span></div>'+
      '<textarea class="ta" id="tx">'+esc(d.text)+'</textarea><div class="xs mute" style="margin-top:6px">Orbit keeps this text with the touch. The audio is deleted once it’s transcribed.</div></div>'+
      '<div class="foot"><button class="btn ghost" onclick="S.db.sec=0;S.db.step=\'ready\';debrief()">Re-record</button><button class="btn primary" onclick="S.db.text=document.getElementById(\'tx\').value;afterTranscript()"><span class="orb">✦</span> Continue</button></div>';
    return;
  }
  if(d.step==='owner'){
    var picked=d.ownerGuess; var o=OWNERS[picked];
    var body='<div class="orbmsg"><span class="o">✦</span><div class="b">This sounds like <b>'+esc(o.contact.split(',')[0])+'</b> of '+esc(o.name)+', owner of '+esc(PROPS[o.props[0]].a)+', '+esc(PROPS[o.props[1]].a)+' and '+(o.props.length-2)+' more. Right?</div></div>';
    if(d.picking){
      body+='<div class="opts"><div class="xs mute">Top matches from what you said</div>'+['haddad','grandave','alcatraz'].map(function(k){return '<button onclick="pickOwner(\''+k+'\')">'+esc(OWNERS[k].name)+'<span class="s">'+esc(OWNERS[k].contact)+' · '+OWNERS[k].props.length+' building(s)</span></button>'}).join('')+
        '<div class="search" style="margin-top:4px"><span class="mute">⌕</span><input placeholder="Search another owner" oninput="pickSearch(this.value)"></div><div id="pickres"></div></div>';
    } else {
      body+='<div class="opts"><button class="on" onclick="pickOwner(\''+picked+'\')">Yes, '+esc(o.contact.split(',')[0])+'</button><button onclick="S.db.picking=true;debrief()">Pick another</button></div>';
    }
    $app.innerHTML=H+'<div class="scroll"><div class="sec" style="margin-top:4px">Who was this with?</div>'+body+'<div class="ro">One owner per debrief. Orbit never creates a new owner from a debrief.</div></div>';
    return;
  }
  if(d.step==='two'){
    $app.innerHTML=H+'<div class="scroll"><div class="orbmsg"><span class="o">✦</span><div class="b">You also mentioned <b>Michael Tran</b> (Grand Ave Holdings). A debrief covers one owner, so I’ll keep this one to Sam Haddad. Want a separate debrief for Michael after this?</div></div>'+
      '<div class="opts"><button onclick="S.pendingTran=true;S.db.step=\'qs\';debrief()">Yes, after this one</button><button onclick="S.pendingTran=false;S.db.step=\'qs\';debrief()">No, skip Michael</button></div></div>';
    return;
  }
  if(d.step==='qs'){
    var Q=questionsFor(d);
    if(!Q.length){ buildItems(); d.step='card'; return debrief(); }
    var html='<div class="orbmsg"><span class="o">✦</span><div class="b">Got it. '+(Q.length===1?'One quick question':(Q.length===2?'Two quick questions':'Three quick questions'))+' so the log is complete.</div></div>';
    Q.forEach(function(q,qi){
      html+='<div class="orbmsg"><span class="o" style="background:#fff;color:var(--navy);border:1px solid var(--line)">'+(qi+1)+'</span><div class="b">'+esc(q[0])+'</div></div><div class="opts">'+q[1].map(function(a){return '<button class="'+(d.answers[qi]===a?'on':'')+'" onclick="S.db.answers['+qi+']=\''+a.replace(/'/g,"\\'")+'\';debrief()">'+esc(a)+'</button>'}).join('')+'</div>';
    });
    var done=Q.every(function(q,qi){return d.answers[qi]});
    html+='<div class="xs mute" style="margin:12px 0 0 40px">You can also answer by voice: <button class="link" onclick="voiceAnswer()">tap to speak</button></div>';
    $app.innerHTML=H+'<div class="scroll">'+html+'</div><div class="foot"><button class="btn ghost" onclick="S.db.step=\'transcript\';debrief()">Back</button><button class="btn primary" '+(done?'':'disabled')+' onclick="buildItems();S.db.step=\'card\';debrief()">See what Orbit will save</button></div>';
    return;
  }
  if(d.step==='card'){ return card(); }
  if(d.step==='saved'){ return receipt(); }
}
function fmt(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}
function startRec(){
  var d=S.db; d.step='rec'; if(!d.cutResume) d.sec=0; debrief();
  clearInterval(d.tick);
  d.tick=setInterval(function(){d.sec++;var t=document.getElementById('tmr');if(t)t.textContent=fmt(d.sec);
    if(d.variant==='cut'&&!d.cutResume&&d.sec>=6){clearInterval(d.tick);d.sec=42;d.step='cut';debrief()}},1000);
  if(d.variant==='cut'&&!d.cutResume) toast('Demo: the screen will “lock” in a few seconds');
}
function stopRec(){
  var d=S.db; clearInterval(d.tick); if(d.sec<4) d.sec=Math.max(d.sec,52)+60; else d.sec+=60;
  if(S.offline){ S.queued={at:'2:14 PM',len:fmt(d.sec)}; d.step='offline-saved'; return debrief(); }
  d.step='transcribing'; debrief();
  setTimeout(function(){
    if(!S.db) return;
    if(d.isTran) d.text=SCRIPT.tran;
    else if(d.cutResume) d.text=SCRIPT.part+SCRIPT.rest;
    else d.text=SCRIPT.full+(d.variant==='two'?SCRIPT.twoTail:'');
    if(d.owner&&d.owner!=='haddad'&&!d.isTran) d.text=genericScript(d.owner);
    d.step='transcript'; debrief();
  },1400);
}
function typeInstead(){var d=S.db;d.text='';d.step='transcript';debrief();setTimeout(function(){var t=document.getElementById('tx');if(t){t.placeholder='Type what happened…';t.focus()}},50)}
function genericScript(k){var o=OWNERS[k];return 'Talked to '+o.contact.split(',')[0]+' about '+PROPS[o.props[0]].a+'. Not ready to sell right now but open to hearing about recent sales nearby. Prefers email. Check back in March.'}
function afterTranscript(){
  var d=S.db; d.step='thinking'; debrief();
  setTimeout(function(){ if(!S.db) return;
    if(!d.owner){ d.ownerGuess=/tran|grand ave holdings/i.test(d.text)&&!/haddad/i.test(d.text)?'grandave':'haddad'; d.step='owner'; }
    else d.step=(d.variant==='two'&&d.owner==='haddad')?'two':'qs';
    debrief();
  },1100);
}
function pickOwner(k){var d=S.db;d.owner=k;d.picking=false;d.step=(d.variant==='two'&&k==='haddad')?'two':'qs';
  if(k!=='haddad'&&!d.isTran&&d.text.indexOf('Sam Haddad')>-1){toast('Demo: the scripted debrief is about Sam. Showing a short version for this owner.');d.text=genericScript(k)}
  debrief()}
function pickSearch(v){var r=find(v);document.getElementById('pickres').innerHTML=r.o.slice(0,4).map(function(k){return '<button onclick="pickOwner(\''+k+'\')">'+esc(OWNERS[k].name)+'<span class="s">'+esc(OWNERS[k].contact)+'</span></button>'}).join('')}
function questionsFor(d){
  if(d.owner==='haddad'&&!d.isTran){
    var q=[['When in March should I set the callback about Lakeshore?',['Mon, Mar 1','Mon, Mar 15','Wed, Mar 31']],
           ['When should I remind you to text Sam the 8-unit sales near the lake?',['Today, 4:00 PM','Mon, Nov 16, 9:00 AM','No, I’ll send it now']]];
    if(!/text him/i.test(d.text)) q=q.slice(0,1);

  }

}

function card(){

    if(i.type==='touch'){
      body+='<div class="d">'+esc(i.how)+' · '+esc(i.out)+'</div><div class="m">'+esc(i.notes)+'</div><div class="tags">'+i.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>'}).join('')+'</div>';
      body+=i.editing?'<select onchange="S.db.items['+ix+'].out=this.value">'+['Spoke','Not selling now','Interested later','Appointment set','Callback requested'].map(function(x){return '<option'+(x===i.out?' selected':'')+'>'+x+'</option>'}).join('')+'</select><textarea oninput="S.db.items['+ix+'].notes=this.value">'+esc(i.notes)+'</textarea><div class="edit"><button class="link" onclick="S.db.items['+ix+'].editing=false;card()">Done editing</button></div>':'<div class="edit"><button class="link" onclick="S.db.items['+ix+'].editing=true;card()">Edit</button></div>';
    } else if(i.type==='st'){
      body='<b>“'+esc(i.t)+'”</b><div class="tags"><span class="pill">'+esc(i.k)+'</span><span class="pill warn">Owner said · unverified</span></div><div class="m">'+esc(i.m)+'</div>'+(i.note?'<div class="m">'+esc(i.note)+'</div>':'');
    } else if(i.type==='cb'){
      body+='<div class="d">'+esc(i.d)+'</div><div class="m">'+esc(i.m)+'</div>'+(i.editing?'<select onchange="var x=S.db.items['+ix+'];x.d=x.d.replace(x.val,this.value);x.val=this.value;x.editing=false;card()">'+i.sel.map(function(x){return '<option'+(x===i.val?' selected':'')+'>'+x+'</option>'}).join('')+'</select>':'<div class="edit"><button class="link" onclick="S.db.items['+ix+'].editing=true;card()">Change date</button></div>');
    } else {
      body+='<div class="d">'+esc(i.d)+'</div><div class="m">'+esc(i.m)+'</div>';
    }
    html+='<div class="bi'+(i.on?'':' offitem')+'"><span class="cb'+(i.on?' on':'')+'" onclick="S.db.items['+ix+'].on=!S.db.items['+ix+'].on;card()">'+(i.on?'✓':'')+'</span><div class="bt">'+body+'</div></div>';
  });
  html+='</div><div class="xs mute" style="margin:10px 2px 0">Nothing is saved until you tap Save all. Untick anything that’s wrong. Owner statements never change property or loan records.</div>';
  $app.innerHTML=hdr('Review and save',{backLabel:'Close'})+'<div class="scroll" style="padding-top:4px">'+html+'</div>'+
    '<div class="foot"><button class="btn ghost" style="flex:0 0 96px" onclick="S.db.step=\'qs\';debrief()">Back</button><button class="btn primary" '+(n?'':'disabled')+' onclick="saveAll()">Save all ('+n+')</button></div>';
}
function saveAll(){
  var d=S.db, k=d.owner, on=d.items.filter(function(i){return i.on});
  var stm=on.filter(function(i){return i.type==='st'}).map(function(i){return {t:i.t,by:i.m,verify:true}});
  var tch=on.filter(function(i){return i.type==='touch'});
  var newT=tch.map(function(i,ix){return {id:'n'+Date.now()+ix,date:'Today',who:'Nolan Jones',how:i.how==='Drop-by'?'Drop-by':i.how,prop:i.prop,out:i.out,sum:i.notes.split('. ')[0]+'.',notes:i.notes,isNew:true,transcript:ix===0?d.text:null,stmts:ix===tch.length-1?stm:[]}});
  if(!newT.length&&stm.length){newT=[{id:'ns',date:'Today',who:'Nolan Jones',how:'Meeting',prop:PROPS[OWNERS[k].props[0]].a,out:'Spoke',sum:'Debrief notes.',notes:'Debrief notes.',isNew:true,transcript:d.text,stmts:stm}]}
  d.saved={k:k,touches:newT};
  S.added[k]=newT.concat(S.added[k]||[]);
  var c={t:tch.length,cb:on.filter(function(i){return i.type==='cb'||i.type==='fu'||i.type==='verify'}).length,s:stm.length};
  d.summary=[c.t?c.t+' touch'+(c.t>1?'es':''):null,c.cb?c.cb+' follow-up'+(c.cb>1?'s':''):null,c.s?c.s+' thing'+(c.s>1?'s':'')+' '+OWNERS[k].first+' told us':null].filter(Boolean).join(', ');
  d.step='saved'; d.undo=10; debrief();
}
function receipt(){
  var d=S.db,k=d.owner;
  $app.innerHTML=hdr('Saved',{noBack:true})+'<div class="scroll"><div class="receipt"><div class="ok">✓</div><h2>Saved</h2><div class="mute">'+esc(d.summary)+'</div></div>'+
    (d.undo>0?'<div class="undo"><div style="flex:1">Saved to '+esc(OWNERS[k].name)+'<div class="bar" id="ubar" style="width:'+(d.undo*10)+'%"></div></div><button onclick="undoSave()">Undo</button></div>':'')+
    (S.pendingTran&&!d.isTran?'<div class="banner"><div style="flex:1"><b>Next: debrief Michael Tran</b>You asked for a separate debrief for Grand Ave Holdings.</div><button class="btn sm primary" onclick="startTran()">Start</button></div>':'')+
    '</div><div class="foot"><button class="btn ghost" onclick="S.db=null;go(\'owner/'+k+'\')">Open record</button><button class="btn primary" onclick="S.db=null;go(\'home\')">Back to Home</button></div>';
  clearInterval(S.undoTimer);
  if(d.undo>0) S.undoTimer=setInterval(function(){ if(!S.db||S.db.step!=='saved'){clearInterval(S.undoTimer);return}
    d.undo--; var b=document.getElementById('ubar'); if(b) b.style.width=(d.undo*10)+'%'; if(d.undo<=0){clearInterval(S.undoTimer);receipt()} },1000);
}
function undoSave(){var d=S.db;clearInterval(S.undoTimer);var ids=d.saved.touches.map(function(t){return t.id});S.added[d.owner]=(S.added[d.owner]||[]).filter(function(t){return ids.indexOf(t.id)<0});d.step='card';toast('Undone. Nothing was saved.');debrief()}
function startTran(){S.pendingTran=false;S.db={owner:'grandave',from:'record',step:'transcribing',variant:'normal',text:'',answers:[],items:null,sec:38,isTran:true};go('debrief');setTimeout(function(){if(S.db){S.db.text=SCRIPT.tran;S.db.step='transcript';debrief()}},900)}

/* ---------------- first run ---------------- */
function install(){
  $app.innerHTML='<div class="scroll"><div class="fr"><img class="appicon" src="icon-180.png" alt=""><h1>Add Orbit to your Home Screen</h1><p>Open it like an app. Your unsent debriefs stay safe on your phone, and Safari won’t clear them.</p>'+
    '<div class="steps"><div><i>1</i>Tap <b>Share</b> <span class="mute">(the square with an arrow) at the bottom of Safari</span></div><div><i>2</i>Scroll and tap <b>Add to Home Screen</b></div><div><i>3</i>Tap <b>Add</b>, then open Orbit from your Home Screen</div></div>'+
    '<button class="btn primary full" onclick="go(\'micperm\')">I’ve added it</button><button class="link" style="margin-top:14px" onclick="go(\'home\')">Skip for now</button></div></div>';
}
function micperm(){
  $app.innerHTML='<div class="scroll"><div class="fr"><div class="appicon" style="background:var(--lav);display:flex;align-items:center;justify-content:center;color:var(--navy);box-shadow:none"><span style="width:38px;height:38px;display:block">'+ICON.mic+'</span></div><h1>Orbit needs your microphone</h1><p>Only when you tap the mic. Orbit never listens in the background, and it doesn’t record calls or meetings, just your own debrief afterward.</p>'+
    '<div class="steps"><div><i>✓</i>Your words become text; the audio is deleted after.</div><div><i>✓</i>Nothing is saved until you tap Save all.</div><div><i>!</i><span>iPhone may ask again after an update. Just tap <b>Allow</b>.</span></div></div>'+
    '<button class="btn primary full" onclick="iosAlert()">Allow microphone</button></div></div>';
}
function iosAlert(){var a=document.createElement('div');a.className='alert';a.innerHTML='<div class="bx"><div class="q"><b>“Orbit” Would Like to Access the Microphone</b><span>Orbit uses the microphone when you tap it to debrief or ask a question.</span></div><div class="bs"><button>Don’t Allow</button><button>Allow</button></div></div>';
  document.getElementById('screen').appendChild(a);var b=a.querySelectorAll('button');b[0].onclick=function(){a.remove();toast('You can turn it on later in Settings › Safari › Microphone.')};b[1].onclick=function(){a.remove();go('home');toast('You’re set. Tap Debrief after your next meeting.')}}

/* ---------------- review guide ---------------- */
var STEPS=[
  ['Main path',[
    ['1 · Home','Search, voice search, Debrief button, recents',function(){fresh();go('home')}],
    ['2 · Find an owner','Type “Haddad” or tap the mic',function(){fresh();go('search/Haddad')}],
    ['3 · Owner record','Signal, buildings, team touch history, statements',function(){fresh();go('owner/haddad')}],
    ['4 · Attack Brief','Brief for the meeting, with “What they’ve told us”',function(){fresh();go('brief/haddad')}],
    ['5 · Ask the brief','Tap a question chip, type, or use the mic',function(){fresh();S.chat.haddad=[BRIEF.haddad.chips[3]];go('brief/haddad')}],
    ['6 · Debrief after the meeting','Record → transcript → 2 questions',function(){fresh();startDebrief('haddad')}],
    ['7 · Review and Save all','Bundled card: touches, follow-ups, statements',function(){fresh();jumpCard('haddad')}],
    ['8 · Saved, with Undo','Then the new touch shows on the record',function(){fresh();jumpCard('haddad');saveAll()}]
  ]],
  ['Other states',[
    ['Property record','3120 Grand Ave: touches for this building only',function(){fresh();go('property/grand3120')}],
    ['Debrief from Home','Orbit confirms which owner you meant',function(){fresh();startDebrief(null)}],
    ['Several matches','Voice search for “the Grand building”',function(){fresh();go('search/__grand')}],
    ['Two owners mentioned','One owner per debrief; offers a second one',function(){fresh();startDebrief(null,null,'two')}],
    ['Recording cut off','The screen locked mid-debrief',function(){fresh();startDebrief('haddad',null,'cut')}],
    ['No signal','Record offline; it uploads later',function(){fresh();S.offline=true;startDebrief('haddad')}],
    ['Waiting to upload','Home with a queued recording',function(){fresh();S.offline=true;S.queued={at:'2:14 PM',len:'1:52'};go('home')}],
    ['Finish your debrief','Left mid-flow; resume from Home',function(){fresh();jumpCard('haddad');leaveDebrief();go('home')}]
  ]],
  ['First run on iPhone',[
    ['Add to Home Screen','Why and how to install from Safari',function(){fresh();go('install')}],
    ['Microphone permission','Explainer, then the iOS prompt',function(){fresh();go('micperm')}]
  ]]
];
function fresh(){var keep=S.recents;clearInterval(S.undoTimer);if(S.db)clearInterval(S.db.tick);reset();S.recents=keep}
function jumpCard(k){S.db={owner:k,from:'record',step:'card',variant:'normal',text:SCRIPT.full,answers:['Mon, Mar 15','Mon, Nov 16, 9:00 AM'],items:null,sec:112};buildItems();go('debrief')}
function guideHtml(){
  var h='<h1>Orbit Mobile</h1><div class="sub">Clickable mockup for Orbit AI PRD v0.5 §15 · Nov 15, 2026. Built for iPhone (Safari, added to the Home Screen).</div>';
  STEPS.forEach(function(g,gi){h+='<h2>'+g[0]+'</h2><ol>'+g[1].map(function(s,si){return '<li><button onclick="STEPS['+gi+'][1]['+si+'][2]();closeDemoSheet()"><b>'+s[0]+'</b><span>'+s[1]+'</span></button></li>'}).join('')+'</ol>'});
  h+='<div class="note"><b>Demo notes.</b> Voice is scripted: tapping the mic plays a sample debrief. Nothing is stored. Data matches the desktop demo. Today is Fri, Nov 13, 2026, 2:14 PM.</div>';
  h+='<div class="note"><b>Not on mobile by design:</b> lists, campaigns, call queues, market screens, settings, editing records. Orbit never records calls or meetings, never predicts who will sell, and never gives a value.</div>';
  h+='<div class="row"><button onclick="fresh();go(\'home\');toast(\'Demo reset\')">Reset demo</button><a href="../index.html">← Desktop demo</a></div>';
  h+='<div class="sub" style="margin-top:14px">On an iPhone, open this page in Safari and use Share › Add to Home Screen to try it full screen.</div>';
  return h;
}
document.getElementById('guide').innerHTML=guideHtml();
function openDemoSheet(){var sh=document.createElement('div');sh.className='sheet';sh.id='demosheet';sh.style.position='fixed';sh.innerHTML='<div class="in"><div class="grab"></div><div class="guide" style="display:block;width:auto;position:static;max-height:none">'+guideHtml()+'</div></div>';sh.onclick=function(e){if(e.target===sh)sh.remove()};document.body.appendChild(sh)}
function closeDemoSheet(){var s=document.getElementById('demosheet');if(s)s.remove()}

/* go */
if(!location.hash) history.replaceState(null,'','#home');
render();
</script>
